<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SB sivy</title>
<link rel="apple-touch-icon" href="../apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-title" content="SB sivy">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" id="tc1" media="(prefers-color-scheme: light)" content="#f2f2f7">
<meta name="theme-color" id="tc2" media="(prefers-color-scheme: dark)" content="#000000">
<meta name="robots" content="noindex">
<!-- Test status baru pre redizajn (nasadenie 1). Statická stránka: žiadny token, žiadne dáta, žiadne volania.
     Nastavenie ako ostrý launcher (black-translucent, appka vo fullscreen iframe). Kolo 3 (C): appka pod hodinami, posun odhadnutý z výšky obrazovky (env() hlási 0),
     pás vo farbe appky (#f2f2f7 / #000) → hodiny si iOS zafarbí sám. Po nasadení 1 tento priečinok zmazať. -->
<style>
  :root { --edge: #f2f2f7; }
  @media (prefers-color-scheme: dark) { :root { --edge: #000; } }
  :root.edge-black { --edge: #000; }
  :root.edge-light { --edge: #f2f2f7; }
  html, body { margin: 0; height: 100%; background: var(--edge); }
  #appwrap { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--edge); }
  #appwrap.pas { padding-top: var(--safetop, 0px); }
  #appframe { flex: 1; width: 100%; border: 0; display: block; background: #fff; }
  #probe { position: fixed; top: 0; left: 0; height: env(safe-area-inset-top); width: 1px; visibility: hidden; }
</style>
</head>
<body>
<div id="probe"></div>
<div id="appwrap" class="pas"><iframe id="appframe" title="Náhľad appky"></iframe></div>
<script>
(function () {
  var wrap = document.getElementById('appwrap');
  var safeTop = Math.round(document.getElementById('probe').getBoundingClientRect().height);
  var standalone = !!(window.navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches));
  var TOP = { 667: 20, 736: 20, 812: 50, 844: 47, 852: 59, 874: 62, 896: 48, 926: 47, 932: 59, 956: 62 };
  var sh = Math.max(screen.height, screen.width), iosApp = standalone && /iP(hone|od)/.test(navigator.userAgent);
  var guessTop = iosApp ? (TOP[sh] || 59) : 0;
  document.documentElement.style.setProperty('--safetop', guessTop + 'px');
  window.sbSet = function (pas) { wrap.classList.toggle('pas', pas); };
  window.sbEdge = function (v) {
    var r = document.documentElement; r.classList.remove('edge-black', 'edge-light');
    var t1 = document.getElementById('tc1'), t2 = document.getElementById('tc2');
    if (v === 'auto') { t1.setAttribute('content', '#f2f2f7'); t2.setAttribute('content', '#000000'); return; }
    r.classList.add('edge-' + v); var c = v === 'black' ? '#000000' : '#f2f2f7';
    t1.setAttribute('content', c); t2.setAttribute('content', c);
  };
  window.sbInfo = function () {
    safeTop = Math.round(document.getElementById('probe').getBoundingClientRect().height);
    return { safeTop: safeTop, standalone: standalone, pas: wrap.classList.contains('pas'), guess: guessTop, ih: innerHeight, sh: screen.height, dark: matchMedia('(prefers-color-scheme: dark)').matches };
  };
  var doc = [
    '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>',
    ':root{--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--mute:#6e6e73;--acc:#1f6fd1;--fill:#e7e7ec}',
    ':root[data-theme=dark]{--bg:#000;--card:#1c1c1e;--ink:#f2f2f7;--mute:#98989f;--acc:#4c9bf5;--fill:#2c2c2e}',
    '*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,sans-serif}',
    '#top{display:flex;align-items:center;justify-content:space-between;padding:6px 16px}',
    '.brand{display:flex;align-items:center;gap:9px}.brand img{width:40px;height:40px}',
    '.brand b{display:block;font-size:16px;letter-spacing:.06em}.brand i{font-style:normal;font-size:12px;color:var(--mute)}',
    '.chip{font-size:15px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--card)}',
    '.chip small{font-size:12px;color:var(--mute);font-weight:500;margin-right:5px}',
    'h1{font-size:30px;margin:10px 20px 12px}.grp{background:var(--card);border-radius:14px;margin:0 16px 12px;padding:4px 16px}',
    '.row{display:flex;justify-content:space-between;align-items:center;min-height:48px;border-bottom:1px solid var(--fill)}.row:last-child{border:0}',
    '.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin:8px 0}',
    '.seg button{flex:1;min-height:44px;border:0;border-radius:8px;background:none;color:var(--ink);font:500 15px -apple-system,sans-serif}',
    '.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}',
    '.info{font-size:13px;color:var(--mute);margin:4px 20px}',
    '</style></head><body>',
    '<div id="top"><span class="brand"><img src="../apple-touch-icon.png?v=2" alt=""><span><b>SMEČKA</b><i>Prešov · test</i></span></span>',
    '<span class="chip"><small>Pokladnica</small>160,30 €</span></div>',
    '<h1>Test C · sivý pás</h1>',
    '<div class="grp"><div class="row">Režim appky</div><div class="seg" id="thm"><button data-v="light" class="on">Svetlý</button><button data-v="dark">Tmavý</button></div></div>',
    '<div class="grp"><div class="row">Farba pásov hore a dole</div><div class="seg" id="edge"><button data-v="auto" class="on">Podľa telefónu</button><button data-v="light">Sivá</button><button data-v="black">Čierna</button></div></div>',
    '<div class="grp"><div class="row">Posun o výšku hodín</div><div class="seg" id="pas"><button data-v="1" class="on">Zapnutý</button><button data-v="0">Vypnutý</button></div></div>',
    '<p class="info" id="info"></p>',
    '<script>',
    'var P=parent;function info(){var i=P.sbInfo();document.getElementById("info").textContent="Výška hodín: "+i.safeTop+" px · z plochy: "+(i.standalone?"áno":"NIE — otvor z ikony na ploche")+" · posun: "+(i.pas?i.guess+" px":"nie")+" · telefón: "+(i.dark?"tmavý":"svetlý")+" · výška okna "+i.ih+" / obrazovka "+i.sh;}',
    'function seg(id,fn){var s=document.getElementById(id);s.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;[].forEach.call(s.children,function(x){x.classList.toggle("on",x===b)});fn(b.getAttribute("data-v"));info();});}',
    'seg("thm",function(v){document.documentElement.setAttribute("data-theme",v);P.sbEdge(v==="dark"?"black":"light")});seg("pas",function(v){P.sbSet(v==="1")});seg("edge",function(v){P.sbEdge(v)});info();',
    '<\/script></body></html>'
  ].join('');
  document.getElementById('appframe').srcdoc = doc;
})();
</script>
</body>
</html>
