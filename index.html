<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SMEČKA</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=2">
<meta name="apple-mobile-web-app-title" content="SMEČKA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16324f">
<!-- ŽIADNY manifest: start_url by pri spustení z plochy zahodil ?token=…
     Token držíme cez URL + localStorage. Standalone rieši apple-mobile-web-app-capable.
     v2.60.111: nové logo SMEČKA Prešov (SVG) + redizajn landing/splash (mockup-schválené). -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;min-height:100%}
  body{background:radial-gradient(120% 80% at 50% 20%, #1f4a72 0%, #16324f 48%, #0f2438 100%);
    color:#fff;font-family:-apple-system,'Helvetica Neue',Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 28px;min-height:100vh;position:relative;overflow:hidden}
  body::before{content:"";position:absolute;top:17%;left:50%;transform:translateX(-50%);
    width:38vh;height:38vh;border-radius:50%;background:radial-gradient(circle,rgba(242,194,79,.15),transparent 65%);pointer-events:none}
  /* LANDING — nové logo (SVG), ~20% menšie, žltý button */
  img.logo{width:min(62vw,264px);height:auto;filter:drop-shadow(0 9px 22px rgba(0,0,0,.4));position:relative;z-index:2;margin-bottom:22px}
  .sub{font-size:14px;font-weight:600;opacity:.92;letter-spacing:.3px;margin:0 0 30px;position:relative;z-index:2}
  a.btn,button.btn{position:relative;z-index:2;display:inline-flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#f6c64a,#e9a92f);color:#16324f;font-weight:900;font-size:16px;
    text-decoration:none;padding:13px 36px;min-height:46px;border-radius:13px;border:0;
    box-shadow:0 7px 18px rgba(233,169,47,.4);letter-spacing:.3px;cursor:pointer;font-family:inherit}
  a.btn.off{opacity:.45;pointer-events:none}
  .hint{margin-top:0;position:absolute;bottom:44px;left:30px;right:30px;z-index:2;font-size:12.5px;opacity:.82;line-height:1.55}
  .hint b{color:#fff}
  .warn{background:rgba(0,0,0,.22);border-radius:12px;padding:14px 16px;position:static;bottom:auto;left:auto;right:auto;margin-top:18px}
  .tokbox{margin-top:8px;display:flex;gap:8px;flex-direction:column;align-items:center}
  .tokbox input{font-size:16px;padding:12px 14px;border-radius:12px;border:0;width:260px;text-align:center;letter-spacing:1px}
  .hidden{display:none}
  /* Full-bleed shell — top-level zostáva github.io (standalone bez Safari chrome),
     v2shell sa renderuje vo fullscreen iframe. iframe = 100%×100%, v2shell rieši safe-area sám. */
  #appwrap{position:fixed;inset:0;z-index:1000;display:none;background:#16324f;overflow:hidden}
  #appframe{display:block;border:0;background:#fff;width:100%;height:100%}
  /* SPLASH — nové logo + animácia, spinner na strede medzery logo↔footer, footer centrovaný */
  #splash{position:absolute;inset:0;z-index:1;
    background:radial-gradient(120% 80% at 50% 42%, #1f4a72 0%, #16324f 50%, #0f2438 100%);
    color:#fff;transition:opacity .3s;pointer-events:none;overflow:hidden}
  #splash.hide{opacity:0}
  #splash::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);
    width:44vh;height:44vh;border-radius:50%;background:radial-gradient(circle,rgba(242,194,79,.14),transparent 65%)}
  #splash .slogo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(58vw,240px);height:auto;filter:drop-shadow(0 9px 22px rgba(0,0,0,.4));z-index:2;
    animation:pop .5s ease-out, breathe 3s ease-in-out .5s infinite}
  @keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.86)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes breathe{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.035)}}
  .spin{width:30px;height:30px;border:3px solid rgba(246,198,74,.3);border-top-color:#f6c64a;
    border-radius:50%;position:absolute;top:78%;left:50%;margin:-15px 0 0 -15px;z-index:2;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #splash .sfoot{position:absolute;bottom:46px;left:0;right:0;z-index:2;text-align:center;
    color:#7e91a6;font-size:11px;font-weight:700;letter-spacing:2.5px}
  html.embed,body.embed{overflow:hidden}
</style>
<script>
  // Token-passthrough + zapamätanie. Token sa NIKDY neukladá v repe — len v URL
  // tohto launchera a v localStorage zariadenia (per-user, na origine launchera).
  var BASE = "https://script.google.com/macros/s/AKfycbxYLRcslCg1c35B1qitXYblGJup4WaoIZg9ZaC2VCRR-BeO80DdoQSpoCYBNIYp1ARPHA/exec?app=v2shell";
  var LS_KEY = "smecka_token";
  function getTokFromUrl(){ var m = location.search.match(/[?&]token=([^&]+)/); return m ? decodeURIComponent(m[1]) : ""; }
  var TOKEN = getTokFromUrl();
  try {
    if (TOKEN) { localStorage.setItem(LS_KEY, TOKEN); }     // ulož pri prvom otvorení s tokenom
    else { TOKEN = localStorage.getItem(LS_KEY) || ""; }     // inak skús zapamätaný
  } catch (e) {}
  var TARGET = TOKEN ? (BASE + "&token=" + encodeURIComponent(TOKEN)) : BASE;
  var STANDALONE = (window.navigator.standalone === true);
  // Spustené z plochy a token máme → appku vložíme do fullscreen iframe;
  // top-level zostane na github.io → standalone bez Safari pásov. Token ide cez src.
  if (STANDALONE && TOKEN) {
    document.documentElement.className += " embed";
    document.addEventListener("DOMContentLoaded", function(){
      document.body.className += " embed";
      var wrap = document.getElementById("appwrap");
      var frame = document.getElementById("appframe");
      var splash = document.getElementById("splash");
      if (!wrap || !frame) return;
      wrap.style.display = "block";
      frame.addEventListener("load", function(){ if (splash) splash.className = "hide"; });
      frame.src = TARGET;
    });
  }
</script>
</head>
<body>
  <!-- Standalone + token: fullscreen iframe shell (skrytý kým JS nezistí standalone) -->
  <div id="appwrap">
    <div id="splash">
      <img class="slogo" src="smecka-logo.svg" alt="SMEČKA Prešov">
      <div class="spin"></div>
      <div class="sfoot">SMEČKA&nbsp;&nbsp;PREŠOV</div>
    </div>
    <iframe id="appframe" title="SMEČKA" allow="clipboard-write"></iframe>
  </div>

  <!-- Bežné Safari / standalone bez tokenu: landing page -->
  <img class="logo" src="smecka-logo.svg" alt="SMEČKA Prešov">
  <p class="sub">Financie &amp; dochádzka tímu</p>

  <a class="btn" id="openBtn" href="#">Otvoriť →</a>

  <div class="hint" id="hint">📲 Pridaj na plochu: ťukni <b>Zdieľať</b> → <b>Pridať na plochu</b> a appka sa otvára na celú obrazovku.</div>

  <!-- Záložné vloženie tokenu (ak by chýbal v URL aj v pamäti) -->
  <div class="hint warn hidden" id="tokWarn">
    Zadaj svoj <b>prístupový token</b> (dostal/a si ho v správe). Zapamätá sa na tomto zariadení.
    <div class="tokbox">
      <input id="tokInput" placeholder="napr. k2x9b4dt7p" autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="btn" id="tokSave">Uložiť a otvoriť →</button>
    </div>
  </div>

  <script>
    document.getElementById('openBtn').href = TARGET;
    if (!TOKEN) {
      // Token chýba (URL aj pamäť) → skry „Otvoriť", ukáž vkladacie pole.
      document.getElementById('openBtn').className = 'btn off';
      document.getElementById('hint').classList.add('hidden');
      document.getElementById('tokWarn').classList.remove('hidden');
      document.getElementById('tokSave').addEventListener('click', function(){
        var t = (document.getElementById('tokInput').value || '').trim();
        if (!t) return;
        try { localStorage.setItem(LS_KEY, t); } catch(e){}
        location.replace(BASE + "&token=" + encodeURIComponent(t));
      });
    }
  </script>
</body>
</html>
