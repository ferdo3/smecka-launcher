<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  .og{width:1200px;height:630px;background:linear-gradient(135deg,#0f2438 0%,#16324f 55%,#1f4a72 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Lato',-apple-system,sans-serif;color:#fff;position:relative;overflow:hidden}
  /* jemný volejbalový akcent vpravo dole */
  .og::after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;
    border-radius:50%;border:3px solid rgba(255,255,255,.07);box-shadow:0 0 0 60px rgba(255,255,255,.03)}
  .logo{width:150px;height:150px;border-radius:34px;box-shadow:0 14px 40px rgba(0,0,0,.35);margin-bottom:32px}
  h1{font-size:104px;font-weight:900;letter-spacing:2px;line-height:1;margin-bottom:14px}
  .sub{font-size:38px;font-weight:700;opacity:.92;letter-spacing:.5px}
  .tag{position:absolute;top:54px;right:60px;background:#1f7a4d;border-radius:18px;
    padding:12px 24px;font-size:26px;font-weight:800;letter-spacing:.5px}
</style></head>
<body>
  <div class="og">
    <div class="tag">🏐 tím</div>
    <img class="logo" src="apple-touch-icon.png" alt="">
    <h1>SMEČKA</h1>
    <div class="sub">Financie &amp; dochádzka tímu</div>
  </div>
</body></html>
